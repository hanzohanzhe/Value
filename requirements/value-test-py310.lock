# VALUE test environment (gate venv) for CPython 3.10 on linux-x86_64.
#
# The gate venv is an overlay on the managed install's read-only Python
# 3.10.18 (``venv --system-site-packages``): the runtime packages come from
# value-all-py310.lock through the base interpreter, and only the packages
# below are added.  The author approved pytest and pypdf (P0 F4); the rest are
# their Linux dependencies.  Point the gate at the venv with
# ``VALUE_GATE_VENV=<venv>`` (scripts/p0_gate.py, scripts/run_backend_tests.py)
# or start the gate with ``<venv>/bin/python -B scripts/p0_gate.py``.
#
# Exact versions are binding: p0_gate's ``test_environment`` step fails when
# the test interpreter has any other version.  ``installed RECORD sha256`` is
# the sha256 of the installed ``<name>-<version>.dist-info/RECORD`` file of
# the reference gate venv (2026-10-05); RECORD itself lists the sha256 of
# every installed file.  Wheel ``--hash=sha256:`` pins are not recorded: no
# wheel was available offline and P0 forbids downloads; add them with
# ``pip hash`` when the wheels are next fetched for an approved install.
#
# packaging (a pytest dependency) is already pinned by the runtime
# (packaging==25.0) and is not repeated here; colorama is a Windows-only
# pytest dependency and is not part of the Linux gate venv.
